[project]
name = "local-deid"
version = "0.1.0"
description = "Offline de-identification of bilingual pediatric SLP documents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.20"]
mlx = ["mlx>=0.25"]
gliner = [
    "onnxruntime>=1.20",
    "sentencepiece>=0.2",
]
app = [
    "cryptography>=44",
    "pyobjc-framework-quartz>=11",
    "pyobjc-framework-security>=11",
    "pywebview>=6.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "tokenizers>=0.21",
    "cryptography>=44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localdeid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
localdeid = "localdeid.cli:main"
