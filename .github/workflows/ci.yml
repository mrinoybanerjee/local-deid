name: Model-free regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen
      - name: Synthetic engine, vault, session and document tests
        run: >-
          uv run --no-sync pytest -q
          --ignore=tests/test_finetune.py
          --ignore=tests/test_app_clipboard.py
          --ignore=tests/test_app_hotkeys.py
